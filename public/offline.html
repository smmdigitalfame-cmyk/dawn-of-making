<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <meta name="robots" content="noindex">
  <title>Offline — Shopify</title>
  <style>
    :root { --background:#101318; --foreground:#f7f7f7; --muted:#b5b8bc; --border:#54585e; }
    * { box-sizing:border-box; } body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--background); color:var(--foreground); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:400px; text-align:center; } img { width:72px; height:72px; } h1 { font-size:24px; } p { color:var(--muted); line-height:1.6; } a { display:inline-block; padding:12px 20px; border:1px solid var(--border); border-radius:8px; color:var(--foreground); text-decoration:none; }
  </style>
</head>
<body><main><img src="/icons/app-192.png" alt=""><h1>You’re offline</h1><p>Reconnect to access your dashboard. Account pages and account data are not saved for offline access.</p><a href="/">Try again</a></main></body>
</html>
